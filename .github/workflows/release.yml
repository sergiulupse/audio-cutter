name: Release

# Builds the .dmg and attaches it to a GitHub Release.
#
# To cut a release:
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The tag is the version. Nothing else needs editing, and no Mac has to be
# involved: GitHub's own macOS runner does the build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the file

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./build.sh --dmg

      - name: Verify the disk image opens
        run: |
          hdiutil attach build/Audio-Cutter.dmg -nobrowse -readonly -mountpoint /tmp/dmg
          test -d "/tmp/dmg/Audio Cutter.app" || { echo "app missing from dmg"; exit 1; }
          hdiutil detach /tmp/dmg -quiet
          echo "disk image is sound"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Audio-Cutter.dmg
          generate_release_notes: true
          body: |
            ## Install

            Download `Audio-Cutter.dmg`, open it, drag **Audio Cutter** to your
            Applications folder.

            ### The first launch will be blocked

            macOS will say it "could not verify" the app is free of malware, and
            offer only **Done** and **Move to Trash**. That is expected: macOS
            blocks any app that has not been through Apple's $99-a-year
            notarization service, and this is free software. Nothing was found
            wrong with it; nobody paid Apple to check it.

            Click **Done**, then:

            1. **System Settings** > **Privacy & Security**
            2. Scroll to **Security** near the bottom. It says *"Audio
               Cutter.app" was blocked to protect your Mac.* Click **Open Anyway**
            3. A second dialog asks *Open "Audio Cutter.app"?* Click **Open
               Anyway** again
            4. Enter your Mac's administrator username and password, then **OK**

            The app opens, and you are never asked again. Four steps and two
            near-identical warnings is Apple's design, not ours. The Open Anyway button only
            appears for about an hour after the warning; if it is gone,
            double-click the app again to bring it back.

            On macOS 15 Sequoia and later, right-clicking the app and choosing
            Open no longer works. Apple removed that path.

            **To avoid the warning completely**, build it yourself. Apps compiled
            on your own machine are never flagged:

            ```
            git clone https://github.com/sergiulupse/audio-cutter.git
            cd audio-cutter && ./build.sh
            ```

            Or clear the flag after installing:

            ```
            xattr -dr com.apple.quarantine "/Applications/Audio Cutter.app"
            ```

            **Optional:** `brew install ffmpeg` adds MP3 export and lossless MP3
            cutting. Everything else works without it.

            Requires macOS 14 or later.
