name: Release

# Builds the .dmg and attaches it to a GitHub Release.
#
# To cut a release:
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The tag is the version. Nothing else needs editing, and no Mac has to be
# involved: GitHub's own macOS runner does the build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the file

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./build.sh --dmg

      - name: Verify the disk image opens
        run: |
          hdiutil attach build/Audio-Cutter.dmg -nobrowse -readonly -mountpoint /tmp/dmg
          test -d "/tmp/dmg/Audio Cutter.app" || { echo "app missing from dmg"; exit 1; }
          hdiutil detach /tmp/dmg -quiet
          echo "disk image is sound"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Audio-Cutter.dmg
          generate_release_notes: true
          body: |
            Open an audio file, select the part you want, export it.

            If it helps you - great! I will add more features in the future, you don't have to credit anybody.

            ## Install

            Requires macOS 14 or later on Apple Silicon.

            Download **Audio-Cutter.dmg** below, open it, drag **Audio Cutter** to Applications.

            ### First launch

            The app is not notarized by Apple, so macOS blocks the first launch.

            <img src="https://raw.githubusercontent.com/sergiulupse/audio-cutter/main/docs/install-1-blocked.jpg" width="280">

            1. Click **Done**.
            2. Open **System Settings > Privacy & Security**, scroll to **Security**, click **Open Anyway**.

            <img src="https://raw.githubusercontent.com/sergiulupse/audio-cutter/main/docs/install-2-open-anyway.jpg" width="470">

            3. Click **Open Anyway** again.

            <img src="https://raw.githubusercontent.com/sergiulupse/audio-cutter/main/docs/install-3-confirm.jpg" width="280">

            4. Enter your administrator password, click **OK**.

            <img src="https://raw.githubusercontent.com/sergiulupse/audio-cutter/main/docs/install-4-password.jpg" width="280">

            This is only needed once. The **Open Anyway** button disappears about an hour after the warning; if it is missing, open the app again. On macOS 15 and later, right-click > Open no longer works.

            To skip the warning, build from source (see README), or run:

            ```
            xattr -dr com.apple.quarantine "/Applications/Audio Cutter.app"
            ```

            ### MP3 support (optional)

            ```
            brew install ffmpeg
            ```

            Needed for MP3 export and lossless MP3 cutting. Everything else works without it.
